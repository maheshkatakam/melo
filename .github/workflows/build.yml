name: Build Melo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODEL_FILE: ggml-small-q5_1.bin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: whisper-${{ env.MODEL_FILE }}-v1

      - name: Download offline speech model (Whisper small, multilingual)
        run: |
          mkdir -p app/src/main/assets/models
          f="app/src/main/assets/models/$MODEL_FILE"
          if [ ! -s "$f" ]; then
            curl -fL --retry 4 --retry-delay 5 -o "$f" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$MODEL_FILE"
          fi
          ls -lh "$f"
          sha256sum "$f"

      - name: Prepare signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MELO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            {
              echo "MELO_KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/melo-release.jks"
              echo "MELO_KEY_ALIAS=melo"
            } >> "$GITHUB_ENV"
            echo "Using the Melo release key."
          else
            echo "::warning::MELO_KEYSTORE_PASSWORD secret is missing, so this APK is signed with a temporary key and won't install over earlier versions."
          fi

      - name: Build release APK
        env:
          MELO_KEYSTORE_PASSWORD: ${{ secrets.MELO_KEYSTORE_PASSWORD }}
          MELO_KEY_PASSWORD: ${{ secrets.MELO_KEYSTORE_PASSWORD }}
          MELO_VERSION_CODE: ${{ github.run_number }}
          MELO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Melo-1.0.${{ github.run_number }}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Melo-1.0.${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" dist/*.apk \
            --title "Melo 1.0.${{ github.run_number }}" \
            --notes "Download the APK below on your phone and open it to install or update Melo." \
            --latest

      - name: Mirror the optional "accurate lyrics" model (one-time)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ACCURATE_MODEL: ggml-large-v3-turbo-q5_0.bin
          ACCURATE_SHA256: 394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2
        run: |
          if gh release view ai-models --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ACCURATE_MODEL"; then
            echo "Already mirrored."
            exit 0
          fi
          curl -fL --retry 4 --retry-delay 5 -o "$ACCURATE_MODEL" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$ACCURATE_MODEL"
          echo "$ACCURATE_SHA256  $ACCURATE_MODEL" | sha256sum -c -
          if ! gh release view ai-models > /dev/null 2>&1; then
            gh release create ai-models --title "Lyrics AI model (optional download)" --latest=false \
              --notes "Melo downloads this file itself when you choose Settings › Lyrics › Accurate model. You don't need to download it here. Whisper large-v3-turbo (MIT licence), via whisper.cpp."
          fi
          gh release upload ai-models "$ACCURATE_MODEL" --clobber
